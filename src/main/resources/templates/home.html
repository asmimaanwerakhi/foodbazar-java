<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>FoodBazar | Home</title>
    <meta charset="UTF-8">

    <style>
        .food-card {
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 15px;
            margin: 20px;
            cursor: pointer;
            transition: box-shadow 0.2s;
        }
        .food-card:hover {
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        .food-card img {
            margin-top: 10px;
            border-radius: 6px;
        }
    </style>
</head>
<body>

<!-- HEADER -->
<div th:replace="~{fragments/headermenu :: headermenu}"></div>

<h2 style="margin:20px;">🔥 Latest Foods</h2>

<div th:if="${foods != null and !foods.isEmpty()}">

    <div th:each="f : ${foods}"
         class="food-card"
         th:onclick="|window.location.href='@{/order/new(foodId=${f.id})}'|">

        <h3 th:text="${f.foodName}">Food Name</h3>

        Price: ৳ <span th:text="${f.price}">0</span><br>

        <p th:text="${f.description}">Description</p>

        <img th:if="${f.imageName != null}"
             th:src="@{'/uploads/' + ${f.imageName}}"
             width="200"
             alt="Food Image">

        <!-- OPTIONAL BUTTON (future safe) -->
        <br><br>
        <button
            onclick="event.stopPropagation(); 
                     window.location.href='/order/new?foodId=[[${f.id}]]'">
            🛒 Order
        </button>

    </div>

</div>

<div th:if="${foods == null or foods.isEmpty()}" style="margin:20px;">
    <p>No food available right now.</p>
</div>

<!-- FOOTER -->
<div th:replace="~{fragments/footermenu :: footermenu}"></div>

</body>
</html>
